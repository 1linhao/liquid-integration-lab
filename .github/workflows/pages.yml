name: 在线演示

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: 1linhao/liquid-ui
          path: liquid-ui
      - uses: actions/checkout@v6
        with:
          repository: 1linhao/liquid-app-shell
          path: liquid-app-shell
      - uses: actions/checkout@v6
        with:
          path: liquid-integration-lab
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - run: npm ci && npm run build
        working-directory: liquid-ui
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: liquid-app-shell
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: liquid-integration-lab
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: liquid-integration-lab/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
